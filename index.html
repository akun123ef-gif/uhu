<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🍔 Menu Burger - Restoran</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET & GLOBAL ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f0f0f;
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1280px;
            width: 100%;
        }

        /* ===== HEADER ===== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid #2a2a2a;
        }

        .logo h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .logo span {
            color: #f5a623;
        }

        .cart-badge {
            background: #f5a623;
            color: #0f0f0f;
            padding: 0.6rem 1.8rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: 0.2s;
            border: none;
        }
        .cart-badge:hover {
            transform: scale(1.04);
            background: #ffb833;
        }

        /* ===== FILTER TAGS ===== */
        .filter-wrap {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-bottom: 2.5rem;
        }
        .filter-btn {
            background: #1e1e1e;
            border: 1px solid #333;
            color: #aaa;
            padding: 0.5rem 1.4rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .filter-btn:hover {
            border-color: #f5a623;
            color: #fff;
        }
        .filter-btn.active {
            background: #f5a623;
            border-color: #f5a623;
            color: #0f0f0f;
        }

        /* ===== GRID MENU ===== */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        /* ===== CARD BURGER ===== */
        .burger-card {
            background: #1a1a1a;
            border-radius: 24px;
            padding: 1.5rem 1.2rem 1.8rem;
            transition: 0.25s ease;
            border: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
        }
        .burger-card:hover {
            transform: translateY(-6px);
            border-color: #f5a623;
            box-shadow: 0 12px 30px rgba(245, 166, 35, 0.08);
        }

        .burger-card .emoji-big {
            font-size: 3.8rem;
            line-height: 1;
            margin-bottom: 0.2rem;
        }

        .burger-card h3 {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 0.4rem 0 0.2rem;
        }

        .burger-card .desc {
            color: #a0a0a0;
            font-size: 0.9rem;
            line-height: 1.5;
            margin: 0.3rem 0 0.6rem;
            flex: 1;
        }

        .burger-card .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin: 0.5rem 0 1rem;
        }
        .burger-card .tags span {
            background: #2a2a2a;
            padding: 0.2rem 0.9rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #bbb;
            letter-spacing: 0.3px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.4rem;
        }

        .price {
            font-size: 1.5rem;
            font-weight: 800;
            color: #f5a623;
        }
        .price small {
            font-size: 0.9rem;
            font-weight: 400;
            color: #777;
        }

        .order-btn {
            background: #f5a623;
            border: none;
            color: #0f0f0f;
            font-weight: 700;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .order-btn:hover {
            background: #ffb833;
            transform: scale(1.04);
        }

        /* ===== MODAL PESANAN ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-overlay.show {
            display: flex;
        }

        .modal-box {
            background: #1a1a1a;
            max-width: 440px;
            width: 90%;
            padding: 2rem 1.8rem;
            border-radius: 28px;
            border: 1px solid #333;
            animation: fadeUp 0.25s ease;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .modal-box h2 {
            font-size: 1.6rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .modal-box .order-item {
            display: flex;
            justify-content: space-between;
            padding: 0.6rem 0;
            border-bottom: 1px solid #2a2a2a;
        }
        .modal-box .total {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 1rem 0 1.2rem;
            color: #f5a623;
        }
        .modal-box .close-modal {
            background: #333;
            border: none;
            color: #fff;
            padding: 0.6rem 1.8rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
        }
        .modal-box .close-modal:hover {
            background: #444;
        }

        .empty-cart {
            color: #888;
            font-style: italic;
            padding: 0.8rem 0;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .logo h1 { font-size: 1.5rem; }
            .cart-badge { font-size: 0.8rem; padding: 0.4rem 1.2rem; }
            .menu-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- HEADER -->
        <header>
            <div class="logo">
                <h1>🍔 <span>Burger</span>Lab</h1>
            </div>
            <button class="cart-badge" id="cartBtn">
                🛒 <span id="cartCount">0</span>
            </button>
        </header>

        <!-- FILTER -->
        <div class="filter-wrap" id="filterWrap">
            <button class="filter-btn active" data-filter="all">Semua</button>
            <button class="filter-btn" data-filter="classic">Klasik</button>
            <button class="filter-btn" data-filter="bbq">BBQ</button>
            <button class="filter-btn" data-filter="spicy">Pedas</button>
            <button class="filter-btn" data-filter="chicken">Ayam</button>
        </div>

        <!-- MENU GRID -->
        <div class="menu-grid" id="menuGrid"></div>
    </div>

    <!-- MODAL KERANJANG -->
    <div class="modal-overlay" id="cartModal">
        <div class="modal-box">
            <h2>🛒 Pesanan Kamu</h2>
            <div id="cartItems">
                <div class="empty-cart">Belum ada pesanan.</div>
            </div>
            <div class="total" id="cartTotal">Total: Rp 0</div>
            <button class="close-modal" id="closeModal">Tutup</button>
        </div>
    </div>

    <script>
        // ============================================================
        // DATA MENU
        // ============================================================
        const menuData = [
            {
                id: 1,
                name: 'Classic Cheeseburger',
                emoji: '🧀',
                desc: 'Daging sapi juicy, keju cheddar leleh, selada, tomat, dan acar.',
                tags: ['classic', 'beef'],
                price: 45000,
            },
            {
                id: 2,
                name: 'BBQ Smoked Burger',
                emoji: '🔥',
                desc: 'Daging sapi dengan saus BBQ smoky, bawang karamel, keju gouda.',
                tags: ['bbq', 'beef'],
                price: 52000,
            },
            {
                id: 3,
                name: 'Spicy Chicken Crispy',
                emoji: '🌶️',
                desc: 'Ayam goreng renyah dengan saus pedas mayo, kol segar, dan cabai.',
                tags: ['spicy', 'chicken'],
                price: 43000,
            },
            {
                id: 4,
                name: 'Double Beef Melt',
                emoji: '🥩',
                desc: 'Dua lapis daging sapi, keju double, saus special, dan bawang goreng.',
                tags: ['classic', 'beef'],
                price: 62000,
            },
            {
                id: 5,
                name: 'BBQ Chick & Cheese',
                emoji: '🍗',
                desc: 'Ayam panggang dengan saus BBQ, keju mozzarella, dan coleslaw.',
                tags: ['bbq', 'chicken'],
                price: 49000,
            },
            {
                id: 6,
                name: 'Hot Lava Burger',
                emoji: '🌋',
                desc: 'Daging sapi dengan sambal lava pedas, keju pepper jack, dan jalapeño.',
                tags: ['spicy', 'beef'],
                price: 55000,
            },
        ];

        // ============================================================
        // STATE
        // ============================================================
        let cart = [];
        let activeFilter = 'all';

        // ============================================================
        // DOM REFS
        // ============================================================
        const grid = document.getElementById('menuGrid');
        const filterWrap = document.getElementById('filterWrap');
        const cartBtn = document.getElementById('cartBtn');
        const cartModal = document.getElementById('cartModal');
        const closeModal = document.getElementById('closeModal');
        const cartItems = document.getElementById('cartItems');
        const cartTotal = document.getElementById('cartTotal');
        const cartCount = document.getElementById('cartCount');

        // ============================================================
        // RENDER MENU
        // ============================================================
        function renderMenu(filter = 'all') {
            const filtered = filter === 'all'
                ? menuData
                : menuData.filter(item => item.tags.includes(filter));

            if (filtered.length === 0) {
                grid.innerHTML = `<p style="color:#888;grid-column:1/-1;text-align:center;padding:2rem;">Tidak ada menu untuk filter ini.</p>`;
                return;
            }

            grid.innerHTML = filtered.map(item => `
                <div class="burger-card" data-id="${item.id}">
                    <div class="emoji-big">${item.emoji}</div>
                    <h3>${item.name}</h3>
                    <p class="desc">${item.desc}</p>
                    <div class="tags">
                        ${item.tags.map(t => `<span>#${t}</span>`).join('')}
                    </div>
                    <div class="card-footer">
                        <span class="price">Rp ${item.price.toLocaleString()}</span>
                        <button class="order-btn" data-id="${item.id}">+ Pesan</button>
                    </div>
                </div>
            `).join('');

            // Event listener untuk tombol "Pesan" di setiap card
            document.querySelectorAll('.order-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(btn.dataset.id);
                    addToCart(id);
                });
            });
        }

        // ============================================================
        // FILTER
        // ============================================================
        filterWrap.addEventListener('click', (e) => {
            const btn = e.target.closest('.filter-btn');
            if (!btn) return;

            // aktifkan style
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            activeFilter = btn.dataset.filter;
            renderMenu(activeFilter);
        });

        // ============================================================
        // CART
        // ============================================================
        function addToCart(id) {
            const item = menuData.find(m => m.id === id);
            if (!item) return;

            const existing = cart.find(c => c.id === id);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...item, qty: 1 });
            }

            updateCartUI();
            // feedback kilat
            const btn = document.querySelector(`.order-btn[data-id="${id}"]`);
            if (btn) {
                btn.textContent = '✓ Ditambahkan';
                setTimeout(() => { btn.innerHTML = '+ Pesan'; }, 800);
            }
        }

        function removeFromCart(id) {
            const idx = cart.findIndex(c => c.id === id);
            if (idx === -1) return;
            if (cart[idx].qty > 1) {
                cart[idx].qty -= 1;
            } else {
                cart.splice(idx, 1);
            }
            updateCartUI();
            renderCartModal();
        }

        function updateCartUI() {
            const totalItems = cart.reduce((sum, i) => sum + i.qty, 0);
            cartCount.textContent = totalItems;
        }

        function renderCartModal() {
            if (cart.length === 0) {
                cartItems.innerHTML = `<div class="empty-cart">Belum ada pesanan.</div>`;
                cartTotal.textContent = 'Total: Rp 0';
                return;
            }

            cartItems.innerHTML = cart.map(item => `
                <div class="order-item">
                    <span>${item.emoji} ${item.name} <strong>×${item.qty}</strong></span>
                    <span>Rp ${(item.price * item.qty).toLocaleString()}
                        <button style="background:#444;border:none;color:#fff;border-radius:50%;width:24px;height:24px;cursor:pointer;margin-left:8px;" 
                                data-id="${item.id}" class="remove-item">−</button>
                    </span>
                </div>
            `).join('');

            const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            cartTotal.textContent = `Total: Rp ${total.toLocaleString()}`;

            // Event listener tombol hapus
            document.querySelectorAll('.remove-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = parseInt(btn.dataset.id);
                    removeFromCart(id);
                });
            });
        }

        // ============================================================
        // MODAL
        // ============================================================
        cartBtn.addEventListener('click', () => {
            renderCartModal();
            cartModal.classList.add('show');
        });

        closeModal.addEventListener('click', () => {
            cartModal.classList.remove('show');
        });

        cartModal.addEventListener('click', (e) => {
            if (e.target === cartModal) cartModal.classList.remove('show');
        });

        // ============================================================
        // INIT
        // ============================================================
        renderMenu('all');
        updateCartUI();
    </script>
</body>
</html>
