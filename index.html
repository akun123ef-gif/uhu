<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halo! ✨</title>
    <style>
        /* ===== RESET & DASAR ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
            background: radial-gradient(ellipse at 30% 20%, #0f0c29, #302b63, #24243e);
            padding: 1.5rem;
            overflow: hidden;
            position: relative;
        }

        /* ===== BINTANG-BINTANG BERGERAK (background) ===== */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--dur, 3s) ease-in-out infinite alternate;
            opacity: 0.6;
            width: var(--size, 3px);
            height: var(--size, 3px);
            top: var(--top, 10%);
            left: var(--left, 20%);
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* ===== KARTU UTAMA ===== */
        .card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 4rem;
            padding: 4rem 5rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 
                0 40px 80px -20px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
            max-width: 700px;
            width: 100%;
        }

        .card:hover {
            transform: scale(1.03) translateY(-6px);
            box-shadow: 
                0 60px 100px -24px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        /* ===== EMOJI HALO ===== */
        .wave {
            font-size: 4.5rem;
            display: inline-block;
            animation: wave 2.5s infinite ease-in-out;
            transform-origin: 70% 70%;
            margin-bottom: 0.25rem;
        }

        @keyframes wave {
            0%   { transform: rotate(0deg); }
            10%  { transform: rotate(14deg); }
            20%  { transform: rotate(-8deg); }
            30%  { transform: rotate(14deg); }
            40%  { transform: rotate(-4deg); }
            50%  { transform: rotate(10deg); }
            60%  { transform: rotate(0deg); }
            100% { transform: rotate(0deg); }
        }

        /* ===== TEKS UTAMA ===== */
        .title {
            font-size: 6.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #ffecd2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
            margin: 0.2rem 0 0.5rem;
            text-shadow: 0 0 40px rgba(245, 87, 108, 0.15);
        }

        /* ===== SUBTEKS ===== */
        .sub {
            display: block;
            font-size: 1.1rem;
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 1.2rem;
            margin-top: 0.5rem;
        }

        .sub span {
            display: inline-block;
            animation: floatText 3s ease-in-out infinite;
        }

        @keyframes floatText {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        /* ===== GARIS DEKORATIF ===== */
        .glow-line {
            width: 80px;
            height: 3px;
            margin: 0.8rem auto 0.2rem;
            background: linear-gradient(90deg, transparent, #f5576c, #f093fb, transparent);
            border-radius: 10px;
            opacity: 0.6;
        }

        /* ===== RESPONSIF ===== */
        @media (max-width: 640px) {
            .card {
                padding: 2.8rem 2rem;
                border-radius: 2.5rem;
            }
            .title {
                font-size: 4.2rem;
            }
            .wave {
                font-size: 3.2rem;
            }
            .sub {
                font-size: 0.85rem;
                letter-spacing: 4px;
            }
        }

        @media (max-width: 400px) {
            .card {
                padding: 2rem 1.2rem;
            }
            .title {
                font-size: 3rem;
            }
            .wave {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== BINTANG DINAMIS ===== -->
    <div class="stars" id="starsContainer"></div>

    <!-- ===== KARTU HALO ===== -->
    <div class="card">
        <div class="wave">👋</div>
        <h1 class="title">Halo</h1>
        <div class="glow-line"></div>
        <span class="sub"><span>Selamat datang ✦</span></span>
    </div>

    <script>
        // ===== BINTANG-BINTANG (40 butir) =====
        (function createStars() {
            const container = document.getElementById('starsContainer');
            const count = 45;
            const fragment = document.createDocumentFragment();

            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = 1.5 + Math.random() * 3.5;
                star.style.setProperty('--size', size + 'px');
                star.style.setProperty('--top', Math.random() * 100 + '%');
                star.style.setProperty('--left', Math.random() * 100 + '%');
                star.style.setProperty('--dur', (2 + Math.random() * 4) + 's');
                star.style.animationDelay = (Math.random() * 5) + 's';
                fragment.appendChild(star);
            }

            container.appendChild(fragment);
        })();
    </script>
</body>
</html>
