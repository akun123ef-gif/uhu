<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halo</title>
    <!-- Gaya dasar untuk tampilan yang bersih dan modern -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #f5f7fa 0%, #e6ecf5 100%);
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            padding: 1rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 3rem;
            padding: 4rem 5rem;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.25),
                        0 8px 24px -6px rgba(0, 0, 0, 0.1),
                        inset 0 1px 2px rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
            text-align: center;
        }

        .card:hover {
            transform: scale(1.02);
            box-shadow: 0 30px 50px -16px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 6rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: #1e293b;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        /* aksen dekoratif */
        .sub {
            font-size: 1.1rem;
            color: #475569;
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: 400;
            border-top: 2px solid rgba(148, 163, 184, 0.3);
            padding-top: 0.75rem;
            display: inline-block;
        }

        /* Responsif untuk layar kecil */
        @media (max-width: 600px) {
            .card {
                padding: 2.5rem 2rem;
                border-radius: 2rem;
            }
            h1 {
                font-size: 3.8rem;
            }
            .sub {
                font-size: 0.9rem;
                letter-spacing: 4px;
            }
        }

        @media (max-width: 400px) {
            .card {
                padding: 2rem 1.2rem;
            }
            h1 {
                font-size: 2.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Halo</h1>
        <span class="sub">👋 selamat datang</span>
    </div>
</body>
</html>
