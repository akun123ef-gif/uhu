<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🍔 BurgerLab - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET & GLOBAL ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0f0f0f;
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        /* ===== LOGIN PAGE ===== */
        .login-container {
            background: #1a1a1a;
            padding: 2.5rem 2rem;
            border-radius: 28px;
            border: 1px solid #2a2a2a;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }

        .login-container .logo {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }
        .login-container .logo span {
            color: #f5a623;
        }
        .login-container .sub {
            text-align: center;
            color: #888;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .login-container label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 0.3rem;
            color: #ccc;
        }

        .login-container input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 14px;
            border: 1px solid #333;
            background: #0f0f0f;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 1.2rem;
            transition: 0.2s;
        }
        .login-container input:focus {
            outline: none;
            border-color: #f5a623;
            box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.15);
        }

        .login-container .btn-login {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 14px;
            background: #f5a623;
            color: #0f0f0f;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 0.5rem;
        }
        .login-container .btn-login:hover {
            background: #ffb833;
            transform: scale(1.02);
        }

        .login-container .switch-auth {
            text-align: center;
            margin-top: 1.2rem;
            color: #888;
            font-size: 0.9rem;
        }
        .login-container .switch-auth a {
            color: #f5a623;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }
        .login-container .switch-auth a:hover {
            text-decoration: underline;
        }

        .login-container .error-msg {
            background: #2a0a0a;
            color: #ff6b6b;
            padding: 0.6rem 1rem;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
            border-left: 3px solid #ff6b6b;
        }
        .login-container .error-msg.show {
            display: block;
        }

        /* ===== MAIN APP (hidden by default) ===== */
        #app {
            display: none;
            width: 100%;
            max-width: 1280px;
            padding: 1rem;
        }

        /* ===== HEADER APP ===== */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid #2a2a2a;
        }

        .app-header .logo h1 {
            font-size: 2rem;
            font-weight: 800;
        }
        .app-header .logo span {
            color: #f5a623;
        }

        .app-header .right-group {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .app-header .user-info {
            color: #aaa;
            font-size: 0.9rem;
        }
        .app-header .user-info strong {
            color: #f5f5f5;
        }

        .app-header .cart-badge {
            background: #f5a623;
            color: #0f0f0f;
            padding: 0.6rem 1.8rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .app-header .cart-badge:hover {
            transform: scale(1.04);
            background: #ffb833;
        }

        .app-header .logout-btn {
            background: transparent;
            border: 1px solid #444;
            color: #aaa;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .app-header .logout-btn:hover {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

        /* ===== FILTER ===== */
        .filter-wrap {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-bottom: 2.5rem;
        }
        .filter-btn {
            background: #1e1e1e;
            border: 1px solid #333;
            color: #aaa;
            padding: 0.5rem 1.4rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .filter-btn:hover {
            border-color: #f5a623;
            color: #fff;
        }
        .filter-btn.active {
            background: #f5a623;
            border-color: #f5a623;
            color: #0f0f0f;
        }

        /* ===== MENU GRID ===== */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 2rem;
        }

        .burger-card {
            background: #1a1a1a;
            border-radius: 24px;
            padding: 1.5rem 1.2rem 1.8rem;
            transition: 0.25s ease;
            border: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
        }
        .burger-card:hover {
            transform: translateY(-6px);
            border-color: #f5a623;
            box-shadow: 0 12px 30px rgba(245, 166, 35, 0.08);
        }
        .burger-card .emoji-big {
            font-size: 3.8rem;
            line-height: 1;
            margin-bottom: 0.2rem;
        }
        .burger-card h3 {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 0.4rem 0 0.2rem;
        }
        .burger-card .desc {
            color: #a0a0a0;
            font-size: 0.9rem;
            line-height: 1.5;
            margin: 0.3rem 0 0.6rem;
            flex: 1;
        }
        .burger-card .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin: 0.5rem 0 1rem;
        }
        .burger-card .tags span {
            background: #2a2a2a;
            padding: 0.2rem 0.9rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #bbb;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.4rem;
        }
        .price {
            font-size: 1.5rem;
            font-weight: 800;
            color: #f5a623;
        }
        .price small {
            font-size: 0.9rem;
            font-weight: 400;
            color: #777;
        }
        .order-btn {
            background: #f5a623;
            border: none;
            color: #0f0f0f;
            font-weight: 700;
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .order-btn:hover {
            background: #ffb833;
            transform: scale(1.04);
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-box {
            background: #1a1a1a;
            max-width: 440px;
            width: 90%;
            padding: 2rem 1.8rem;
            border-radius: 28px;
            border: 1px solid #333;
            animation: fadeUp 0.25s ease;
        }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .modal-box h2 {
            font-size: 1.6rem;
            margin-bottom: 1rem;
        }
        .modal-box .order-item {
            display: flex;
            justify-content: space-between;
            padding: 0.6rem 0;
            border-bottom: 1px solid #2a2a2a;
        }
        .modal-box .order-item button {
            background: #444;
            border: none;
            color: #fff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            margin-left: 8px;
        }
        .modal-box .order-item button:hover {
            background: #ff6b6b;
        }
        .modal-box .total {
            font-size: 1.4rem;
            font-weight: 700;
            margin: 1rem 0 1.2rem;
            color: #f5a623;
        }
        .modal-box .close-modal {
            background: #333;
            border: none;
            color: #fff;
            padding: 0.6rem 1.8rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }
        .modal-box .close-modal:hover {
            background: #444;
        }
        .empty-cart {
            color: #888;
            font-style: italic;
            padding: 0.8rem 0;
        }

        @media (max-width: 600px) {
            .app-header .logo h1 { font-size: 1.4rem; }
            .app-header .right-group { gap: 0.5rem; flex-wrap: wrap; }
            .menu-grid { grid-template-columns: 1fr; }
            .login-container { padding: 1.8rem 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- ============================================================ -->
    <!-- LOGIN PAGE -->
    <!-- ============================================================ -->
    <div class="login-container" id="loginPage">
        <div class="logo">🍔 <span>Burger</span>Lab</div>
        <div class="sub">Login untuk memesan burger favoritmu</div>

        <div class="error-msg" id="loginError">Username atau password salah!</div>

        <label for="loginUser">Username</label>
        <input type="text" id="loginUser" placeholder="Masukkan username" value="admin" />

        <label for="loginPass">Password</label>
        <input type="password" id="loginPass" placeholder="Masukkan password" value="admin123" />

        <button class="btn-login" id="loginBtn">🔑 Login</button>

        <div class="switch-auth">
            Belum punya akun? <a id="switchToRegister">Daftar di sini</a>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- REGISTER PAGE (hidden) -->
    <!-- ============================================================ -->
    <div class="login-container" id="registerPage" style="display:none;">
        <div class="logo">📝 <span>Daftar</span> Akun</div>
        <div class="sub">Buat akun baru untuk mulai memesan</div>

        <div class="error-msg" id="registerError" style="display:none;"></div>

        <label for="regUser">Username</label>
        <input type="text" id="regUser" placeholder="Pilih username" />

        <label for="regPass">Password</label>
        <input type="password" id="regPass" placeholder="Buat password" />

        <label for="regPassConfirm">Konfirmasi Password</label>
        <input type="password" id="regPassConfirm" placeholder="Ketik ulang password" />

        <button class="btn-login" id="registerBtn">✅ Daftar</button>

        <div class="switch-auth">
            Sudah punya akun? <a id="switchToLogin">Login di sini</a>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- MAIN APP (hidden until login) -->
    <!-- ============================================================ -->
    <div id="app">
        <div class="app-header">
            <div class="logo">
                <h1>🍔 <span>Burger</span>Lab</h1>
            </div>
            <div class="right-group">
                <span class="user-info">👤 <strong id="currentUser">User</strong></span>
                <button class="cart-badge" id="cartBtn">
                    🛒 <span id="cartCount">0</span>
                </button>
                <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
            </div>
        </div>

        <!-- FILTER -->
        <div class="filter-wrap" id="filterWrap">
            <button class="filter-btn active" data-filter="all">Semua</button>
            <button class="filter-btn" data-filter="classic">Klasik</button>
            <button class="filter-btn" data-filter="bbq">BBQ</button>
            <button class="filter-btn" data-filter="spicy">Pedas</button>
            <button class="filter-btn" data-filter="chicken">Ayam</button>
        </div>

        <!-- MENU GRID -->
        <div class="menu-grid" id="menuGrid"></div>
    </div>

    <!-- ============================================================ -->
    <!-- MODAL KERANJANG -->
    <!-- ============================================================ -->
    <div class="modal-overlay" id="cartModal">
        <div class="modal-box">
            <h2>🛒 Pesanan Kamu</h2>
            <div id="cartItems">
                <div class="empty-cart">Belum ada pesanan.</div>
            </div>
            <div class="total" id="cartTotal">Total: Rp 0</div>
            <button class="close-modal" id="closeModal">Tutup</button>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        // DATA MENU
        // ============================================================
        const menuData = [
            { id: 1, name: 'Classic Cheeseburger', emoji: '🧀', desc: 'Daging sapi juicy, keju cheddar leleh, selada, tomat, dan acar.', tags: ['classic', 'beef'], price: 45000 },
            { id: 2, name: 'BBQ Smoked Burger', emoji: '🔥', desc: 'Daging sapi dengan saus BBQ smoky, bawang karamel, keju gouda.', tags: ['bbq', 'beef'], price: 52000 },
            { id: 3, name: 'Spicy Chicken Crispy', emoji: '🌶️', desc: 'Ayam goreng renyah dengan saus pedas mayo, kol segar, dan cabai.', tags: ['spicy', 'chicken'], price: 43000 },
            { id: 4, name: 'Double Beef Melt', emoji: '🥩', desc: 'Dua lapis daging sapi, keju double, saus special, dan bawang goreng.', tags: ['classic', 'beef'], price: 62000 },
            { id: 5, name: 'BBQ Chick & Cheese', emoji: '🍗', desc: 'Ayam panggang dengan saus BBQ, keju mozzarella, dan coleslaw.', tags: ['bbq', 'chicken'], price: 49000 },
            { id: 6, name: 'Hot Lava Burger', emoji: '🌋', desc: 'Daging sapi dengan sambal lava pedas, keju pepper jack, dan jalapeño.', tags: ['spicy', 'beef'], price: 55000 },
        ];

        // ============================================================
        // AUTH SYSTEM (localStorage)
        // ============================================================
        const USERS_KEY = 'burgerlab_users';
        const SESSION_KEY = 'burgerlab_session';

        function getUsers() {
            return JSON.parse(localStorage.getItem(USERS_KEY)) || {};
        }

        function saveUsers(users) {
            localStorage.setItem(USERS_KEY, JSON.stringify(users));
        }

        function getSession() {
            return JSON.parse(localStorage.getItem(SESSION_KEY)) || null;
        }

        function setSession(username) {
            localStorage.setItem(SESSION_KEY, JSON.stringify({ username, loginAt: Date.now() }));
        }

        function clearSession() {
            localStorage.removeItem(SESSION_KEY);
        }

        // ============================================================
        // DOM REFS
        // ============================================================
        const loginPage = document.getElementById('loginPage');
        const registerPage = document.getElementById('registerPage');
        const app = document.getElementById('app');
        const currentUser = document.getElementById('currentUser');

        const loginUser = document.getElementById('loginUser');
        const loginPass = document.getElementById('loginPass');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');

        const regUser = document.getElementById('regUser');
        const regPass = document.getElementById('regPass');
        const regPassConfirm = document.getElementById('regPassConfirm');
        const registerBtn = document.getElementById('registerBtn');
        const registerError = document.getElementById('registerError');

        const switchToRegister = document.getElementById('switchToRegister');
        const switchToLogin = document.getElementById('switchToLogin');

        const logoutBtn = document.getElementById('logoutBtn');

        // ============================================================
        // AUTH FUNCTIONS
        // ============================================================
        function showLogin() {
            loginPage.style.display = 'block';
            registerPage.style.display = 'none';
            app.style.display = 'none';
            loginError.classList.remove('show');
        }

        function showRegister() {
            loginPage.style.display = 'none';
            registerPage.style.display = 'block';
            app.style.display = 'none';
            registerError.style.display = 'none';
        }

        function showApp(username) {
            loginPage.style.display = 'none';
            registerPage.style.display = 'none';
            app.style.display = 'block';
            currentUser.textContent = username;
            renderMenu('all');
            updateCartUI();
        }

        function handleLogin() {
            const username = loginUser.value.trim();
            const password = loginPass.value.trim();

            if (!username || !password) {
                loginError.textContent = 'Username dan password tidak boleh kosong!';
                loginError.classList.add('show');
                return;
            }

            const users = getUsers();
            if (users[username] && users[username] === password) {
                setSession(username);
                loginError.classList.remove('show');
                showApp(username);
            } else {
                loginError.textContent = 'Username atau password salah!';
                loginError.classList.add('show');
            }
        }

        function handleRegister() {
            const username = regUser.value.trim();
            const password = regPass.value.trim();
            const confirm = regPassConfirm.value.trim();

            registerError.style.display = 'none';

            if (!username || !password || !confirm) {
                registerError.textContent = 'Semua field harus diisi!';
                registerError.style.display = 'block';
                return;
            }

            if (username.length < 3) {
                registerError.textContent = 'Username minimal 3 karakter!';
                registerError.style.display = 'block';
                return;
            }

            if (password.length < 4) {
                registerError.textContent = 'Password minimal 4 karakter!';
                registerError.style.display = 'block';
                return;
            }

            if (password !== confirm) {
                registerError.textContent = 'Password dan konfirmasi tidak cocok!';
                registerError.style.display = 'block';
                return;
            }

            const users = getUsers();
            if (users[username]) {
                registerError.textContent = 'Username sudah terdaftar!';
                registerError.style.display = 'block';
                return;
            }

            users[username] = password;
            saveUsers(users);
            alert('✅ Pendaftaran berhasil! Silakan login.');
            showLogin();
            loginUser.value = username;
            loginPass.value = '';
        }

        function handleLogout() {
            if (confirm('Yakin ingin logout?')) {
                clearSession();
                cart = [];
                updateCartUI();
                showLogin();
            }
        }

        // ============================================================
        // CHECK SESSION ON LOAD
        // ============================================================
        function checkSession() {
            const session = getSession();
            if (session && session.username) {
                const users = getUsers();
                if (users[session.username]) {
                    showApp(session.username);
                    return;
                }
            }
            showLogin();
        }

        // ============================================================
        // EVENT LISTENERS - AUTH
        // ============================================================
        loginBtn.addEventListener('click', handleLogin);
        loginPass.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });
        loginUser.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });

        registerBtn.addEventListener('click', handleRegister);
        regPassConfirm.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleRegister(); });

        switchToRegister.addEventListener('click', showRegister);
        switchToLogin.addEventListener('click', showLogin);

        logoutBtn.addEventListener('click', handleLogout);

        // ============================================================
        // CART STATE
        // ============================================================
        let cart = [];

        // ============================================================
        // RENDER MENU
        // ============================================================
        function renderMenu(filter = 'all') {
            const grid = document.getElementById('menuGrid');
            const filtered = filter === 'all'
                ? menuData
                : menuData.filter(item => item.tags.includes(filter));

            if (filtered.length === 0) {
                grid.innerHTML = `<p style="color:#888;grid-column:1/-1;text-align:center;padding:2rem;">Tidak ada menu untuk filter ini.</p>`;
                return;
            }

            grid.innerHTML = filtered.map(item => `
                <div class="burger-card" data-id="${item.id}">
                    <div class="emoji-big">${item.emoji}</div>
                    <h3>${item.name}</h3>
                    <p class="desc">${item.desc}</p>
                    <div class="tags">
                        ${item.tags.map(t => `<span>#${t}</span>`).join('')}
                    </div>
                    <div class="card-footer">
                        <span class="price">Rp ${item.price.toLocaleString()}</span>
                        <button class="order-btn" data-id="${item.id}">+ Pesan</button>
                    </div>
                </div>
            `).join('');

            document.querySelectorAll('.order-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(btn.dataset.id);
                    addToCart(id);
                });
            });
        }

        // ============================================================
        // FILTER
        // ============================================================
        document.getElementById('filterWrap').addEventListener('click', (e) => {
            const btn = e.target.closest('.filter-btn');
            if (!btn) return;

            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            renderMenu(btn.dataset.filter);
        });

        // ============================================================
        // CART FUNCTIONS
        // ============================================================
        function addToCart(id) {
            const item = menuData.find(m => m.id === id);
            if (!item) return;

            const existing = cart.find(c => c.id === id);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...item, qty: 1 });
            }

            updateCartUI();

            const btn = document.querySelector(`.order-btn[data-id="${id}"]`);
            if (btn) {
                btn.textContent = '✓ Ditambahkan';
                setTimeout(() => { btn.innerHTML = '+ Pesan'; }, 800);
            }
        }

        function removeFromCart(id) {
            const idx = cart.findIndex(c => c.id === id);
            if (idx === -1) return;
            if (cart[idx].qty > 1) {
                cart[idx].qty -= 1;
            } else {
                cart.splice(idx, 1);
            }
            updateCartUI();
            renderCartModal();
        }

        function updateCartUI() {
            const totalItems = cart.reduce((sum, i) => sum + i.qty, 0);
            document.getElementById('cartCount').textContent = totalItems;
        }

        function renderCartModal() {
            const container = document.getElementById('cartItems');
            const totalEl = document.getElementById('cartTotal');

            if (cart.length === 0) {
                container.innerHTML = `<div class="empty-cart">Belum ada pesanan.</div>`;
                totalEl.textContent = 'Total: Rp 0';
                return;
            }

            container.innerHTML = cart.map(item => `
                <div class="order-item">
                    <span>${item.emoji} ${item.name} <strong>×${item.qty}</strong></span>
                    <span>Rp ${(item.price * item.qty).toLocaleString()}
                        <button data-id="${item.id}" class="remove-item">−</button>
                    </span>
                </div>
            `).join('');

            const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            totalEl.textContent = `Total: Rp ${total.toLocaleString()}`;

            document.querySelectorAll('.remove-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    removeFromCart(parseInt(btn.dataset.id));
                });
            });
        }

        // ============================================================
        // MODAL
        // ============================================================
        const cartModal = document.getElementById('cartModal');
        document.getElementById('cartBtn').addEventListener('click', () => {
            renderCartModal();
            cartModal.classList.add('show');
        });
        document.getElementById('closeModal').addEventListener('click', () => {
            cartModal.classList.remove('show');
        });
        cartModal.addEventListener('click', (e) => {
            if (e.target === cartModal) cartModal.classList.remove('show');
        });

        // ============================================================
        // INIT
        // ============================================================
        // Tambahkan user default jika belum ada
        const defaultUsers = getUsers();
        if (!defaultUsers.admin) {
            defaultUsers.admin = 'admin123';
            saveUsers(defaultUsers);
        }

        checkSession();
    </script>
</body>
</html>
